<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Weather Report</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #4fc3f7, #81d4fa);
            text-align: center;
            color: white;
            margin: 0;
            padding: 0;
        }
        h1 {
            margin: 20px 0;
        }
        #map {
            height: 400px;
            width: 50%;
            margin: 20px auto;
            border-radius: 10px;
        }
        .weather-box {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            padding: 15px;
            border-radius: 10px;
            width: 300px;
            margin: 0 auto;
        }
        input {
            padding: 8px;
            border-radius: 5px;
            border: none;
        }
        button {
            padding: 8px 12px;
            border-radius: 5px;
            border: none;
            background: #0288d1;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>🌍 Global Weather Report</h1>
    <p><i>Check weather for any city</i></p>

    <input type="text" id="city" placeholder="Enter city name">
    <button onclick="getWeather()">Get Weather</button>

    <div class="weather-box" id="weather"></div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([20, 0], 2); // World view
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
        ).addTo(map);

        var marker;

        async function getWeather() {
            const city = document.getElementById("city").value;
            if (!city) return;

            // Step 1: Get coordinates from OpenStreetMap Nominatim
            const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${city}`);
            const geoData = await geoRes.json();
            if (geoData.length === 0) {
                document.getElementById("weather").innerHTML = "City not found!";
                return;
            }
            const lat = geoData[0].lat;
            const lon = geoData[0].lon;

            // Step 2: Get weather from Open-Meteo
            const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
            const weatherData = await weatherRes.json();
            const temp = weatherData.current_weather.temperature;
            const wind = weatherData.current_weather.windspeed;

            // Step 3: Show weather info
            document.getElementById("weather").innerHTML = `
        <h3>${city}</h3>
        <p>Temperature: ${temp} °C</p>
        <p>Wind Speed: ${wind} km/h</p>
      `;

            // Step 4: Update map
            if (marker) map.removeLayer(marker);
            marker = L.marker([lat, lon]).addTo(map)
                .bindPopup(`${city}: ${temp}°C, Wind ${wind} km/h`)
                .openPopup();
            map.setView([lat, lon], 8);
        }
    </script>
</body>

</html>
